<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questlog</title>
<meta name="description" content="Spiele-Tracker: was du gespielt hast, was noch ansteht, mit Bewertung, Spielzeit und Statistik.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDE4D2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161209" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Questlog">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html{ color-scheme: light dark; }
  html, body{ margin:0; padding:0; }
  [hidden]{ display:none !important; }
  img{ max-width:100%; }

  :root{
    --bg:#EDE4D2;
    --surface:#F8F2E4;
    --surface-2:#E3D7BE;
    --ink:#2A2117;
    --ink-soft:#6B5F4C;
    --ink-faint:#8E8267;
    --border:#CDBE9C;
    --border-soft:#DBCFAE;
    --accent:#B5622A;
    --accent-strong:#8C4718;
    --accent-tint:#EAD3B7;
    --st-playing:#B5622A;
    --st-paused:#4E6478;
    --st-wishlist:#7A6D8C;
    --st-played:#3F6B4A;
    --shadow:0 1px 2px rgba(42,33,23,.06), 0 6px 16px rgba(42,33,23,.07);
    --radius-s:4px;
    --radius-m:10px;
    --radius-l:16px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body:'Literata', Georgia, 'Times New Roman', serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161209;
      --surface:#1F1A11;
      --surface-2:#251F15;
      --ink:#EEE3CC;
      --ink-soft:#B7A985;
      --ink-faint:#8A7D5F;
      --border:#3B3220;
      --border-soft:#2E2818;
      --accent:#E08A3E;
      --accent-strong:#F2A662;
      --accent-tint:#3A2A16;
      --st-playing:#E08A3E;
      --st-paused:#8FB0CB;
      --st-wishlist:#B7A5D6;
      --st-played:#7FC190;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161209;
    --surface:#1F1A11;
    --surface-2:#251F15;
    --ink:#EEE3CC;
    --ink-soft:#B7A985;
    --ink-faint:#8A7D5F;
    --border:#3B3220;
    --border-soft:#2E2818;
    --accent:#E08A3E;
    --accent-strong:#F2A662;
    --accent-tint:#3A2A16;
    --st-playing:#E08A3E;
    --st-paused:#8FB0CB;
    --st-wishlist:#B7A5D6;
    --st-played:#7FC190;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
  }
  ::selection{ background:var(--accent-tint); color:var(--accent-strong); }

  .app{
    display:grid;
    grid-template-columns:290px 1fr;
    min-height:100vh;
  }

  /* ---------- Header brand mark ---------- */
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:22px 20px 14px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand svg{ width:26px; height:26px; flex:none; }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.35rem;
    letter-spacing:-.01em;
    margin:0;
  }
  .brand .sub{
    font-family:var(--font-mono);
    font-size:.62rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    display:block;
    margin-top:1px;
  }
  .totals-line{
    padding:10px 20px 14px;
    font-family:var(--font-mono);
    font-size:.7rem;
    color:var(--ink-faint);
    border-bottom:1px solid var(--border-soft);
  }
  .totals-line b{ color:var(--ink-soft); font-weight:600; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--surface-2);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:14px 12px 24px;
  }
  .add-btn{
    margin:14px 20px 4px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 14px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:var(--radius-s);
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .add-btn:hover{ background:var(--accent-strong); }
  .add-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .nav-item{
    display:flex; align-items:center; gap:9px;
    width:100%; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:var(--radius-m);
    padding:9px 10px; margin:10px 0 4px; cursor:pointer;
    font-family:var(--font-display); font-weight:600; font-size:.92rem; color:var(--ink);
  }
  .nav-item svg{ width:16px; height:16px; flex:none; color:var(--ink-faint); }
  .nav-item:hover{ background:var(--surface); }
  .nav-item.active{ background:var(--surface); border-color:var(--border); box-shadow:var(--shadow); }
  .nav-item.active svg{ color:var(--accent); }

  .group-label{
    font-family:var(--font-mono);
    font-size:.65rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:18px 8px 6px;
  }

  .game-card{
    display:flex; flex-direction:column; gap:5px;
    width:100%;
    text-align:left;
    background:transparent;
    border:1px solid transparent;
    border-radius:var(--radius-m);
    padding:9px 10px;
    cursor:pointer;
    margin-bottom:3px;
  }
  .game-card:hover{ background:var(--surface); }
  .game-card.active{
    background:var(--surface);
    border-color:var(--border);
    box-shadow:var(--shadow);
  }
  .game-card .row1{ display:flex; align-items:center; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .game-card .title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:.94rem;
    color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .game-card .meta{
    font-family:var(--font-mono);
    font-size:.68rem;
    color:var(--ink-faint);
    padding-left:16px;
  }
  .empty-lib{
    padding:20px 10px; color:var(--ink-faint); font-size:.85rem;
  }

  /* ---------- Main ---------- */
  main{ padding:32px 40px 60px; max-width:840px; }
  .no-game{ color:var(--ink-faint); font-family:var(--font-display); font-size:1.1rem; padding-top:10vh; text-align:center; }

  .game-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:20px; margin-bottom:22px;
  }
  .game-head h2{
    font-family:var(--font-display);
    font-size:2.1rem;
    font-weight:700;
    letter-spacing:-.01em;
    text-wrap:balance;
    margin:0 0 8px;
  }
  .game-head .tags{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill{
    font-family:var(--font-mono);
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:100px;
    border:1px solid var(--border);
  }
  .platform-pill{ color:var(--ink-soft); background:var(--surface); }
  select.status-select{
    font-family:var(--font-mono);
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 22px 3px 9px;
    border-radius:100px;
    border:1px solid var(--border);
    background-color:var(--surface);
    color:var(--ink);
    cursor:pointer;
    -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
    background-position:calc(100% - 12px) 55%, calc(100% - 8px) 55%;
    background-size:4px 4px,4px 4px;
    background-repeat:no-repeat;
  }
  .icon-btn{
    background:none; border:1px solid var(--border); border-radius:var(--radius-s);
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-faint); flex:none;
  }
  .icon-btn:hover{ color:#B23A2E; border-color:#B23A2E; }
  .icon-btn svg{ width:15px; height:15px; }

  .stat-row{
    display:flex; gap:28px; flex-wrap:wrap;
    padding:16px 18px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-m);
    margin-bottom:22px;
  }
  .stat{ display:flex; flex-direction:column; gap:3px; }
  .stat .label{
    font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  .stat .value{ font-family:var(--font-mono); font-size:1.05rem; font-variant-numeric:tabular-nums; }
  .stat.hours .value{ display:flex; align-items:baseline; gap:4px; }
  .hours-input{
    width:52px; border:none; background:transparent; color:var(--ink);
    font-family:var(--font-mono); font-size:1.05rem; padding:0; border-bottom:1px dashed var(--border);
  }
  .flames{ display:flex; gap:3px; }
  .flames button{ background:none; border:none; padding:1px; cursor:pointer; }
  .flames svg{ width:16px; height:16px; }
  .flame-off{ fill:var(--surface-2); stroke:var(--border); stroke-width:1.2; }
  .flame-on{ fill:var(--accent); stroke:var(--accent-strong); stroke-width:1.2; }

  .notes-area{
    width:100%; min-height:160px; font-family:var(--font-body); font-size:.95rem; line-height:1.6;
    border:1px solid var(--border-soft); border-radius:var(--radius-m); background:var(--surface);
    padding:16px 18px; color:var(--ink); resize:vertical;
  }
  .notes-label{
    font-family:var(--font-mono); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:8px; display:block;
  }
  .notes-hint{ font-family:var(--font-mono); font-size:.66rem; color:var(--ink-faint); margin-top:8px; }

  /* Seed banner */
  .seed-banner{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--accent-tint); border:1px solid var(--border-soft);
    border-radius:var(--radius-m); padding:10px 16px; margin-bottom:20px;
    font-size:.82rem; color:var(--ink-soft);
  }
  .seed-banner button{
    font-family:var(--font-mono); font-size:.68rem; letter-spacing:.05em; text-transform:uppercase;
    background:none; border:1px solid var(--border); border-radius:var(--radius-s);
    padding:5px 10px; cursor:pointer; color:var(--ink); flex:none;
  }

  /* ---------- Stats view ---------- */
  .stats-head h2{
    font-family:var(--font-display); font-size:1.9rem; font-weight:700; margin:0 0 4px;
  }
  .stats-head p{ color:var(--ink-faint); font-size:.9rem; margin:0 0 26px; }

  .kpi-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
    gap:12px; margin-bottom:32px;
  }
  .kpi-tile{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-m);
    padding:14px 16px; display:flex; flex-direction:column; gap:5px;
  }
  .kpi-tile .label{
    font-family:var(--font-mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);
  }
  .kpi-tile .value{
    font-family:var(--font-display); font-size:1.7rem; font-weight:600; font-variant-numeric:tabular-nums;
  }

  .stat-section{ margin-bottom:32px; }
  .section-title{
    font-family:var(--font-display); font-size:1.05rem; font-weight:600; margin:0 0 14px;
  }
  .barlist{ display:flex; flex-direction:column; gap:11px; }
  .barlist-row{
    display:grid; grid-template-columns:104px 1fr 64px; align-items:center; gap:12px;
  }
  .barlist-label{
    font-family:var(--font-mono); font-size:.72rem; color:var(--ink-soft);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .barlist-track{
    height:10px; background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:100px; overflow:hidden;
  }
  .barlist-fill{ height:100%; border-radius:100px; }
  .barlist-value{
    font-family:var(--font-mono); font-size:.76rem; color:var(--ink-soft);
    text-align:right; font-variant-numeric:tabular-nums;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,15,8,.42);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
    box-shadow:var(--shadow); width:100%; max-width:380px; padding:26px;
  }
  .modal h3{ font-family:var(--font-display); font-size:1.3rem; margin:0 0 18px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .field label{ font-family:var(--font-mono); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .field input, .field select{
    font-family:var(--font-body); font-size:.92rem; padding:8px 11px;
    border:1px solid var(--border); border-radius:var(--radius-s); background:var(--bg); color:var(--ink);
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .ghost-btn{
    font-family:var(--font-mono); font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
    background:none; border:1px solid transparent; padding:8px 14px; cursor:pointer; color:var(--ink-soft);
  }
  .ghost-btn:hover{ color:var(--ink); }

  .empty-state{
    color:var(--ink-faint); font-size:.88rem; padding:6px 0 20px; font-style:italic;
    font-family:var(--font-body);
  }

  @media (max-width: 760px){
    .app{ grid-template-columns:1fr; }
    .sidebar{ min-height:auto; border-right:none; border-bottom:1px solid var(--border-soft); }
    .sidebar-scroll{ max-height:38vh; }
    main{ padding:24px 18px 50px; }
    .game-head h2{ font-size:1.6rem; }
    .barlist-row{ grid-template-columns:84px 1fr 52px; gap:8px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 2c-.6 2.6-2.4 3.9-3.9 5.4C6.4 9.1 5 11 5 13.5 5 18.2 8.1 21 12 21s7-2.8 7-7.5c0-3.3-2.1-5-3.4-6.7.2 1.6-.4 2.6-1.3 3.2-.2-2.9-1.3-5.4-2.3-8z" fill="var(--accent)" stroke="var(--accent-strong)" stroke-width=".6"/></svg>
      <div>
        <h1>Questlog</h1>
        <span class="sub">Spiele-Tracker</span>
      </div>
    </div>
    <div class="totals-line" id="totalsLine"></div>
    <div class="sidebar-scroll">
      <button class="add-btn" id="openAdd">+ Neues Spiel</button>
      <button class="nav-item" id="statsNav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V10M12 19V5M19 19v-7"/></svg>
        Statistik
      </button>
      <div id="libraryList"></div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h3>Neues Spiel</h3>
    <div class="field">
      <label for="fTitle">Titel</label>
      <input id="fTitle" type="text" placeholder="z.B. Elden Ring">
    </div>
    <div class="field">
      <label for="fPlatform">Plattform</label>
      <input id="fPlatform" type="text" placeholder="z.B. PS5, Switch, PC">
    </div>
    <div class="field">
      <label for="fStatus">Status</label>
      <select id="fStatus">
        <option value="wishlist" selected>Warteliste</option>
        <option value="playing">Am Laufen</option>
        <option value="paused">Pausiert</option>
        <option value="played">Durchgespielt</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" id="cancelAdd">Abbrechen</button>
      <button class="primary-btn" id="confirmAdd" style="background:var(--accent);color:#fff;border:none;border-radius:var(--radius-s);padding:8px 16px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;">Anlegen</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STATUS_META = {
    playing:{ label:"Am Laufen", color:"var(--st-playing)" },
    paused:{ label:"Pausiert", color:"var(--st-paused)" },
    played:{ label:"Durchgespielt", color:"var(--st-played)" },
    wishlist:{ label:"Warteliste", color:"var(--st-wishlist)" }
  };
  var GROUP_ORDER = ["playing","paused","wishlist","played"];
  var STORE_KEY = "questlog.v2";

  function uid(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){
    return String(s==null ? "" : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function seedData(){
    return {
      seeded:true, view:"library", selected:null,
      games:[
        {
          id:uid(), title:"Dark Souls III", platform:"PC", status:"playing", rating:4, hours:38,
          notes:"Build: Quality/Dex mit Lothric Knight Sword + Sacred Flame als Backup. Ring-Setup: Chloranthy +3, Favor +3, Carthus Milkring, Prisoner's Chain.\n\nPontiff Sulyvahn im 4. Versuch geschafft, Bloodbite Ring war der Schlüssel gegen die Giftklingen. Abyss Watchers haben am längsten gedauert. Als nächstes: Irithyll weiter erkunden, dann Aldrich."
        },
        {
          id:uid(), title:"The Witcher 3: Wild Hunt", platform:"PC", status:"played", rating:5, hours:126,
          notes:"Blood & Wine + Hearts of Stone komplett durchgespielt, gutes Ende gewählt. Build war Alchemy/Signs-Hybrid mit Quen-Fokus. Toussaint optisch das schönste Gebiet im Spiel, Gaunter O'Dimm bester Antagonist."
        },
        {
          id:uid(), title:"The Legend of Zelda: Tears of the Kingdom", platform:"Switch", status:"paused", rating:0, hours:22,
          notes:"Wasser- und Feuertempel geschafft, Wind- und Erdtempel stehen noch aus."
        },
        {
          id:uid(), title:"Pokémon Karmesin", platform:"Switch", status:"wishlist", rating:0, hours:0, notes:""
        },
        {
          id:uid(), title:"Elden Ring", platform:"PC", status:"wishlist", rating:0, hours:0, notes:""
        }
      ]
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    var seed = seedData();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(seed)); }catch(e){}
    return seed;
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = load();
  if(!state.view) state.view = "library";
  if(!state.selected && state.games.length){ state.selected = state.games[0].id; }

  function getGame(id){
    for(var i=0;i<state.games.length;i++){ if(state.games[i].id===id) return state.games[i]; }
    return null;
  }

  function flameIcon(){
    return '<path d="M12 2c-.6 2.6-2.4 3.9-3.9 5.4C6.4 9.1 5 11 5 13.5 5 18.2 8.1 21 12 21s7-2.8 7-7.5c0-3.3-2.1-5-3.4-6.7.2 1.6-.4 2.6-1.3 3.2-.2-2.9-1.3-5.4-2.3-8z"/>';
  }
  function miniFlames(n){
    var s = "";
    for(var i=0;i<n;i++){
      s += '<svg viewBox="0 0 24 24" style="width:11px;height:11px;fill:var(--accent);stroke:var(--accent-strong);stroke-width:1.2;vertical-align:-1px;margin-right:1px">'+flameIcon()+'</svg>';
    }
    return s;
  }

  function renderTotals(){
    var el = document.getElementById('totalsLine');
    var n = state.games.length;
    var hrs = state.games.reduce(function(s,g){ return s+(g.hours||0); }, 0);
    el.innerHTML = n
      ? '<b>'+n+'</b> Spiel'+(n===1?'':'e') + ' · <b>'+hrs+'</b> Std. gesamt'
      : 'Noch keine Spiele erfasst';
  }

  function renderLibrary(){
    var el = document.getElementById('libraryList');
    var statsBtn = document.getElementById('statsNav');
    statsBtn.classList.toggle('active', state.view==='stats');

    if(!state.games.length){
      el.innerHTML = '<div class="empty-lib">Noch keine Spiele im Questlog.</div>';
      return;
    }
    var byStatus = { playing:[], paused:[], played:[], wishlist:[] };
    state.games.forEach(function(g){ byStatus[g.status].push(g); });

    var html = "";
    GROUP_ORDER.forEach(function(key){
      var list = byStatus[key];
      if(!list.length) return;
      html += '<div class="group-label">'+STATUS_META[key].label+' ('+list.length+')</div>';
      list.forEach(function(g){
        var meta = STATUS_META[g.status];
        var active = (state.view==='library' && g.id===state.selected);
        html += '<button class="game-card'+(active?' active':'')+'" data-id="'+g.id+'">'+
          '<div class="row1"><span class="dot" style="background:'+meta.color+'"></span>'+
          '<span class="title">'+esc(g.title)+'</span></div>'+
          '<div class="meta">'+esc(g.platform||"—")+(g.hours?' · '+g.hours+' Std.':'')+(g.rating?' · '+g.rating+'/5':'')+'</div>'+
        '</button>';
      });
    });
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.game-card'), function(btn){
      btn.addEventListener('click', function(){
        state.view = "library";
        state.selected = btn.getAttribute('data-id');
        save(); renderAll();
      });
    });
  }

  function renderMain(){
    if(state.view === "stats"){ renderStats(); return; }
    renderGamePanel();
  }

  function renderGamePanel(){
    var main = document.getElementById('main');
    var g = getGame(state.selected);
    if(!g){
      main.innerHTML = '<div class="no-game">Wähle ein Spiel aus der Liste — oder leg eins neu an.</div>';
      return;
    }

    var seedNote = "";
    if(state.seeded){
      seedNote = '<div class="seed-banner"><span>Das hier sind Beispieldaten zum Ausprobieren.</span>'+
        '<button id="clearSeed">Beispiele löschen</button></div>';
    }

    var flames = '<div class="flames">';
    for(var i=1;i<=5;i++){
      flames += '<button class="flame-btn" data-v="'+i+'" title="'+i+' von 5"><svg viewBox="0 0 24 24" class="'+(i<=g.rating?'flame-on':'flame-off')+'">'+flameIcon()+'</svg></button>';
    }
    flames += '</div>';

    main.innerHTML =
      seedNote+
      '<div class="game-head">'+
        '<div>'+
          '<h2>'+esc(g.title)+'</h2>'+
          '<div class="tags">'+
            '<span class="pill platform-pill">'+esc(g.platform||"—")+'</span>'+
            '<select class="status-select" id="statusSelect">'+
              Object.keys(STATUS_META).map(function(k){
                return '<option value="'+k+'"'+(k===g.status?' selected':'')+'>'+STATUS_META[k].label+'</option>';
              }).join('')+
            '</select>'+
          '</div>'+
        '</div>'+
        '<button class="icon-btn" id="deleteGame" title="Spiel löschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H9.8a2 2 0 0 1-2-1.9L7 7"/></svg></button>'+
      '</div>'+
      '<div class="stat-row">'+
        '<div class="stat"><span class="label">Bewertung</span>'+flames+'</div>'+
        '<div class="stat hours"><span class="label">Spielzeit</span>'+
          '<span class="value"><input type="number" min="0" class="hours-input" id="hoursInput" value="'+g.hours+'"> Std.</span></div>'+
      '</div>'+
      '<label class="notes-label" for="notesArea">Notizen (optional)</label>'+
      '<textarea class="notes-area" id="notesArea" placeholder="Build, Fortschritt, Eindruck, was auch immer hängen bleiben soll …">'+esc(g.notes)+'</textarea>'+
      '<div class="notes-hint">Wird automatisch gespeichert.</div>';

    wireGamePanelEvents(g);
  }

  function wireGamePanelEvents(g){
    var main = document.getElementById('main');

    var clearSeedBtn = document.getElementById('clearSeed');
    if(clearSeedBtn) clearSeedBtn.addEventListener('click', function(){
      state.games = [];
      state.selected = null;
      state.seeded = false;
      save(); renderAll();
    });

    document.getElementById('statusSelect').addEventListener('change', function(e){
      g.status = e.target.value; save(); renderAll();
    });
    document.getElementById('deleteGame').addEventListener('click', function(){
      if(!confirm('„'+g.title+'" wirklich aus dem Questlog löschen?')) return;
      state.games = state.games.filter(function(x){ return x.id!==g.id; });
      state.selected = state.games.length ? state.games[0].id : null;
      save(); renderAll();
    });
    document.getElementById('hoursInput').addEventListener('change', function(e){
      var v = parseInt(e.target.value,10);
      g.hours = isNaN(v) ? 0 : Math.max(0,v);
      save(); renderAll();
    });
    Array.prototype.forEach.call(main.querySelectorAll('.flame-btn'), function(btn){
      btn.addEventListener('click', function(){
        var v = parseInt(btn.getAttribute('data-v'),10);
        g.rating = (g.rating===v) ? v-1 : v;
        save(); renderAll();
      });
    });
    var notesArea = document.getElementById('notesArea');
    if(notesArea) notesArea.addEventListener('input', function(){
      g.notes = notesArea.value;
      save();
    });
  }

  function barRow(label, value, max, colorVar, valueLabel){
    var pct = max>0 ? Math.max(2, Math.round((value/max)*100)) : 0;
    if(value<=0) pct = 0;
    return '<div class="barlist-row">'+
      '<div class="barlist-label">'+label+'</div>'+
      '<div class="barlist-track"><div class="barlist-fill" style="width:'+pct+'%;background:'+colorVar+'"></div></div>'+
      '<div class="barlist-value">'+esc(valueLabel)+'</div>'+
    '</div>';
  }
  function section(title, innerHtml){
    return '<div class="stat-section"><h3 class="section-title">'+title+'</h3>'+innerHtml+'</div>';
  }

  function renderStats(){
    var main = document.getElementById('main');
    var games = state.games;

    if(!games.length){
      main.innerHTML =
        '<div class="stats-head"><h2>Statistik</h2><p>Noch keine Auswertung möglich.</p></div>'+
        '<div class="empty-state">Leg dein erstes Spiel an, dann füllt sich das hier.</div>';
      return;
    }

    var countPlaying = games.filter(function(g){ return g.status==='playing'; }).length;
    var countPaused = games.filter(function(g){ return g.status==='paused'; }).length;
    var countPlayed = games.filter(function(g){ return g.status==='played'; }).length;
    var countWishlist = games.filter(function(g){ return g.status==='wishlist'; }).length;
    var totalHours = games.reduce(function(s,g){ return s+(g.hours||0); }, 0);
    var rated = games.filter(function(g){ return g.rating>0; });
    var avgRating = rated.length ? (rated.reduce(function(s,g){ return s+g.rating; },0)/rated.length) : null;

    var kpis = [
      { label:"Spiele gesamt", value:games.length },
      { label:"Durchgespielt", value:countPlayed },
      { label:"Warteliste", value:countWishlist },
      { label:"Spielzeit gesamt", value:totalHours+" Std." },
      { label:"Ø Bewertung", value: avgRating!==null ? avgRating.toFixed(1)+" / 5" : "–" }
    ];
    var kpiHtml = kpis.map(function(k){
      return '<div class="kpi-tile"><span class="label">'+k.label+'</span><span class="value">'+k.value+'</span></div>';
    }).join('');

    var statusMax = Math.max(countPlaying, countPaused, countPlayed, countWishlist, 1);
    var statusHtml =
      barRow(STATUS_META.playing.label, countPlaying, statusMax, 'var(--st-playing)', countPlaying) +
      barRow(STATUS_META.paused.label, countPaused, statusMax, 'var(--st-paused)', countPaused) +
      barRow(STATUS_META.played.label, countPlayed, statusMax, 'var(--st-played)', countPlayed) +
      barRow(STATUS_META.wishlist.label, countWishlist, statusMax, 'var(--st-wishlist)', countWishlist);

    var ratingCounts = [0,0,0,0,0];
    var unrated = 0;
    games.forEach(function(g){
      if(g.rating>0) ratingCounts[g.rating-1]++; else unrated++;
    });
    var ratingMax = Math.max.apply(null, ratingCounts.concat([unrated,1]));
    var ratingHtml = "";
    for(var r=5; r>=1; r--){
      ratingHtml += barRow(miniFlames(r), ratingCounts[r-1], ratingMax, 'var(--accent)', ratingCounts[r-1]);
    }
    ratingHtml += barRow('<span style="font-style:italic;color:var(--ink-faint)">Unbewertet</span>', unrated, ratingMax, 'var(--border)', unrated);

    var topByHours = games.filter(function(g){ return g.hours>0; })
      .slice().sort(function(a,b){ return b.hours-a.hours; }).slice(0,6);
    var hoursMax = topByHours.length ? topByHours[0].hours : 1;
    var hoursHtml = topByHours.length
      ? topByHours.map(function(g){
          return barRow(esc(g.title), g.hours, hoursMax, 'var(--accent)', g.hours+' Std.');
        }).join('')
      : '<div class="empty-state">Noch keine geloggte Spielzeit.</div>';

    var platforms = {};
    games.forEach(function(g){
      var p = (g.platform||"").trim() || "Unbekannt";
      platforms[p] = (platforms[p]||0) + 1;
    });
    var platformEntries = Object.keys(platforms).map(function(p){ return [p, platforms[p]]; })
      .sort(function(a,b){ return b[1]-a[1]; });
    var platformMax = platformEntries.length ? platformEntries[0][1] : 1;
    var platformHtml = platformEntries.map(function(e){
      return barRow(esc(e[0]), e[1], platformMax, 'var(--st-wishlist)', e[1]);
    }).join('');

    main.innerHTML =
      '<div class="stats-head"><h2>Statistik</h2><p>Auswertung über alle erfassten Spiele.</p></div>'+
      '<div class="kpi-grid">'+kpiHtml+'</div>'+
      section('Status', '<div class="barlist">'+statusHtml+'</div>')+
      section('Bewertung', '<div class="barlist">'+ratingHtml+'</div>')+
      section('Meistgespielt', '<div class="barlist">'+hoursHtml+'</div>')+
      section('Plattformen', '<div class="barlist">'+platformHtml+'</div>');
  }

  function renderAll(){
    renderTotals();
    renderLibrary();
    renderMain();
  }

  document.getElementById('statsNav').addEventListener('click', function(){
    state.view = "stats";
    save(); renderAll();
  });

  // Modal
  var overlay = document.getElementById('overlay');
  document.getElementById('openAdd').addEventListener('click', function(){
    document.getElementById('fTitle').value="";
    document.getElementById('fPlatform').value="";
    document.getElementById('fStatus').value="wishlist";
    overlay.hidden = false;
    document.getElementById('fTitle').focus();
  });
  document.getElementById('cancelAdd').addEventListener('click', function(){ overlay.hidden = true; });
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.hidden = true; });
  document.getElementById('confirmAdd').addEventListener('click', function(){
    var title = document.getElementById('fTitle').value.trim();
    if(!title){ document.getElementById('fTitle').focus(); return; }
    var ng = {
      id:uid(), title:title,
      platform:document.getElementById('fPlatform').value.trim(),
      status:document.getElementById('fStatus').value,
      rating:0, hours:0, notes:""
    };
    state.games.unshift(ng);
    state.view = "library";
    state.selected = ng.id;
    overlay.hidden = true;
    save(); renderAll();
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && !overlay.hidden) overlay.hidden = true;
  });

  renderAll();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
